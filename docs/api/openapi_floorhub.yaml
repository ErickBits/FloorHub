        resolution_seconds: { type: integer, nullable: true, description: 'resolved_at − claimed_at' }
        replies:
          type: array
          description: Conversación entre el agente y el supervisor, del mensaje más antiguo al más reciente
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              body: { type: string }
