        body: { type: string }
        priority: { type: string, enum: [info, critical] }
        published_at: { type: string, format: date-time }
        author_name: { type: string }
        acknowledged_at: { type: string, format: date-time, nullable: true }

    SupervisorAnnouncement:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        priority: { type: string, enum: [info, critical] }
        published_at: { type: string, format: date-time }
        reminder_interval_minutes: { type: integer, nullable: true }
        reminders_sent: { type: integer }
        author_name: { type: string }
