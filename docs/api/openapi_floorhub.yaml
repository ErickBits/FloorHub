        acknowledged_at: { type: string, format: date-time, nullable: true }

    AnnouncementStatus:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        priority: { type: string, enum: [info, critical] }
        total: { type: integer }
        acknowledgedCount: { type: integer }
        percent: { type: integer, minimum: 0, maximum: 100 }
