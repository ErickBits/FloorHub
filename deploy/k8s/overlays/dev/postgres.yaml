# Solo en minikube. En AWS esta función la cumple RDS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: floorhub_owner
            - name: POSTGRES_PASSWORD
              value: floorhub_owner_dev
            - name: POSTGRES_DB
              value: floorhub
          ports:
            - containerPort: 5432
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "floorhub_owner", "-d", "floorhub"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "floorhub_owner", "-d", "floorhub"]
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
