apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: floorhub
resources:
  - ../../base
  - postgres.yaml
# Valores falsos solo para minikube. En prod el Secret lo crea scripts/deploy.sh.
secretGenerator:
  - name: floorhub-secrets
    literals:
      - DATABASE_URL=postgres://floorhub_app:floorhub_app_dev@postgres:5432/floorhub
      - MIGRATION_DATABASE_URL=postgres://floorhub_owner:floorhub_owner_dev@postgres:5432/floorhub
      - JWT_SECRET=solo-minikube-no-usar-en-produccion-123456
      - SEED_PASSWORD=Demo-FloorHub-2026
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: floorhub-api
    newName: floorhub/api
    newTag: local
  - name: floorhub-gateway
    newName: floorhub/gateway
    newTag: local
  - name: floorhub-worker
    newName: floorhub/worker
    newTag: local
  - name: floorhub-nginx
    newName: floorhub/nginx
    newTag: local
  - name: floorhub-migrate
    newName: floorhub/migrate
    newTag: local
patches:
  - target:
      kind: Service
      name: nginx
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
